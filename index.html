<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ahmad Zamir — Computer Science Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #101013;
    --ink: #e7e7ea;
    --muted: #8a8a93;
    --red: #e63946;
    --red-dim: #3a1216;
    --border: #232328;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .statusbar {
    height: 3px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red) 70%, var(--red-dim) 70%, var(--red-dim) 100%);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 40px;
  }

  .eyebrow {
    color: var(--red);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .eyebrow::before { content: "▸ "; }

  h1 {
    font-size: clamp(40px, 7vw, 68px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--red); }

  .subhead {
    margin-top: 24px;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
    line-height: 1.65;
    max-width: 52ch;
    margin-left: auto;
    margin-right: auto;
  }
  .subhead strong { color: var(--ink); font-weight: 500; }

  .links {
    margin-top: 36px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .links a:hover { color: var(--red); border-color: var(--red); }

  .portrait {
    order: -1;
  }
  .portrait img {
    display: block;
    width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    filter: saturate(1.05);
    box-shadow: 8px 8px 0 var(--red-dim);
  }

  /* tech stack pinned to the bottom */
  .stack {
    margin-top: 64px;
    border-top: 1px solid var(--border);
    padding-top: 22px;
  }
  .stack-label {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .stack-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    font-size: 13px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--ink);
    background: var(--surface);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .chip:hover { border-color: var(--red); color: var(--red); }

  footer {
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
    padding: 20px 24px 28px;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 760px) {
    .portrait img { width: 220px; height: 220px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="statusbar"></div>
  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">UiTM · Computer Science</p>
        <h1>Ahmad<br /><span class="accent">Zamir</span></h1>
        <p class="subhead">
          I'm a <strong>computer science student from UiTM</strong>, aspiring to be a
          <strong>data analyst</strong>, <strong>software engineer</strong>, and
          <strong>full-stack developer</strong>.
        </p>
        <div class="links">
          <a href="https://github.com/ahmadzamir1403">github</a>
          <a href="https://www.linkedin.com/in/ahmad-zamir-823105232">linkedin</a>
        </div>
      </div>
      <div class="portrait">
        <img src="asuka.jpg" alt="Asuka Langley Souryuu" />
      </div>
    </section>

    <section class="stack">
      <p class="stack-label">Tech I work with</p>
      <div class="stack-list">
        <span class="chip">TypeScript</span>
        <span class="chip">JavaScript</span>
        <span class="chip">Python</span>
        <span class="chip">Next.js</span>
        <span class="chip">React</span>
        <span class="chip">Tailwind CSS</span>
        <span class="chip">Node.js</span>
        <span class="chip">Supabase</span>
        <span class="chip">SQL</span>
        <span class="chip">Git</span>
        <span class="chip">Vercel</span>
      </div>
    </section>
  </main>
  <footer>© 2026 Ahmad Zamir</footer>
</body>
</html>
